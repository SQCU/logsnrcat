# Sparse Hierarchical FSQ Autoencoder with Fractal Data
# Use this for training the kmaze_ae jointly with the transformer

[model]
dim = 512
depth = 8
num_heads = 8
topo_dim = 3
mlp_depth = 1
vocab_size = 151936
global_layer_interval = 4
num_experts = 8
num_active = 3
rope_base = 500
mlp_ratio = 4.0
jitter_noise = 0.1
window_size = 10.0

[model.patch_embedder]
input_channels = 3
fourier_dim = 16
context_size = 6
stride = 4
mlp_depth = 2

# GQA configuration for main transformer
[model.gqa]
enabled = true
n_kv_heads = 2         # 8 query heads / 2 kv heads = 4x sharing

[training]
ae_steps = 2000
steps = 0
lambda_coeff = 0.2
mode = "naive"
batch_size = 8
compile = true
compile_dynamic = true
schedule_bounds = [5.0, -4.0]
precision = "bf16"

[training.graph_capture]
enabled = true
warmup_steps = 20
capture_after_warmup = true
use_dedicated_stream = true

# Sparse AE Configuration - THIS ENABLES KMAZE_AE
[training.sparse_ae]
enabled = true
ae_type = "sparse_dim"  # "sparse_dim" (3-bit per-patch sparsity) | "swiglu" (binary level-global, 2D RoPE)
n_levels = 6
patch_size = 16
hidden_dim = 256
code_dim = 128
k_per_patch = 4        # For sparse_dim: keep 4 of 128 dims = 97% sparsity
                       # For swiglu: k_active (level-global dims)
residual_scale = 2.0
fourier_dim = 16
ae_loss_weight = 0.1   # Weight for AE reconstruction loss
logsnr_loss_weight = 0.1  # Weight for logsnr prediction loss
n_layers = 4           # Transformer layers per encoder/decoder

# Attention configuration for AE transformer layers
[training.sparse_ae.attention]
mode = "gemma_bigbird" # "full" | "sliding" | "bigbird" | "gemma" | "gemma_bigbird"
window_size = 4        # For sliding/bigbird: attend to ±window_size patches
global_layer_interval = 4  # For gemma: every Nth layer is global
n_global_tokens = 4    # For bigbird/gemma_bigbird: number of register tokens
bigbird_layout = [2, 2]  # For gemma_bigbird: [n_local, n_bigbird] layers per cycle
random_min_k = 3       # Random attention: at least this many random keys
random_min_p = 0.02    # Random attention: at least this % of seq_len (whichever is larger)
n_query_heads = 8
n_kv_heads = 2         # GQA ratio: 8/2 = 4x KV sharing

[training.online_variance_correction]
enabled = true
num_buckets = 20
snr_min = -5.0
snr_max = 5.0
ema_decay = 0.99
warmup_steps = 100

[training.bucketing]
enabled = true
base_resolution = 64
base_batch_size = 32
caching_resolution = 128

[[training.bucketing.image_buckets]]
resolution = 64
weight = 1.0

[[training.bucketing.image_buckets]]
resolution = 128
weight = 1.0

[[training.bucketing.image_buckets]]
resolution = 256
weight = 0.5

# Heterogeneous optimizer: Muon for transformer, AdamW for embeddings/norms
[training.optimizer]
type = "heterogeneous"

[training.optimizer.muon]
lr = 0.02
momentum = 0.95
nesterov = true
ns_steps = 5

[training.optimizer.adamw]
lr = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]

[training.optimizer.scheduler]
type = "onecycle"
pct_start = 0.1
div_factor = 10.0
final_div_factor = 25.0

[training.ae_optimizer]
lr = 3e-4
weight_decay = 0.1
max_lr = 3e-4
pct_start = 0.1

[sampling]
num_samples = 8
steps = 25
target_logsnr = 10.0
resolutions = [64, 128, 256]
enable_sweep = false
sweep_count = 4
sweep_length = 4
sweep_range = [5.0, 1.0]

# Page table sized for actual workload:
# base_cost = (64/4)² × 32 = 8192 tokens/batch
# blocks_needed = 8192/128 = 64, use 128 with 2x headroom
[page_table]
num_blocks = 128
block_size = 128
max_batch_size = 32
max_logical_blocks = 128

[logging]
output_dir = "./experiments_sparse_ae"
log_interval = 50
sample_after_training = true

# Dataset mix - Fractal-heavy for AE warmup
[dataset_mix.fractal_main]
type = "fractal"
ratio = 0.5
noise_mode = "uniform"
[dataset_mix.fractal_main.params]
seed = 42
fractal_types = ["mandelbrot", "julia", "burning_ship"]
color_palette = "random"
text_position = "none"
resolution = 256
max_iterations = 256
[dataset_mix.fractal_main.noise_params]
min_snr = -4.0
max_snr = 5.0

[dataset_mix.fractal_split]
type = "fractal"
ratio = 0.5
noise_mode = "split"
[dataset_mix.fractal_split.params]
seed = 123
fractal_types = ["julia", "tricorn"]
color_palette = "fire"
text_position = "none"
resolution = 256
max_iterations = 256
[dataset_mix.fractal_split.noise_params]
min_snr = -5.0
max_snr = 5.0
angle_range_deg = 45.0

[dataset_mix.checker_baseline]
type = "checkerboard"
ratio = 0.3
noise_mode = "split"
[dataset_mix.checker_baseline.params]
seed = 456
resolution = 64
text_position = "none"
[dataset_mix.checker_baseline.noise_params]
min_snr = -4.0
max_snr = 5.0
angle_range_deg = 30.0

[dataset_mix.torus_baseline]
type = "torus"
ratio = 0.3
noise_mode = "split"
[dataset_mix.torus_baseline.params]
seed = 789
resolution = 64
text_position = "none"
[dataset_mix.torus_baseline.noise_params]
min_snr = -4.0
max_snr = 5.0
angle_range_deg = 45.0

# Sparse sprite atlas - pixel art with logit-biased sampling
[dataset_mix.sprite_atlas]
type = "sprite_atlas"
ratio = 0.4
noise_mode = "uniform"
[dataset_mix.sprite_atlas.params]
data_dir = "data/infinite_fusion"
[dataset_mix.sprite_atlas.params.sampling_config]
split = "all"
mode = "uniform_sprites"
adjustment_mode = "additive"
temperature = 1.0
seed = 42
[dataset_mix.sprite_atlas.params.sampling_config.adjustments]
"134" = 0.1              # Head ID 134 +0.1
"*.134" = 0.1            # Body ID 134 +0.1
"procedural:*" = -0.1    # Procedural sprites -0.1 (prefer custom/base)
[dataset_mix.sprite_atlas.params.render_config]
res_scaling = "do_not"
background_mode = "solid_random"  # Uniform color per sample (not noise)
jitter = true
[dataset_mix.sprite_atlas.noise_params]
min_snr = -4.0
max_snr = 5.0

# Sprite Atlas Dataset Training Config
# 120k+ fusion sprites (96x96), combinatorial sprite fusions with artist credits

[model]
dim = 512
depth = 8
num_heads = 8
topo_dim = 3
mlp_depth = 1
vocab_size = 151936
global_layer_interval = 4
num_experts = 8
num_active = 3
rope_base = 500
mlp_ratio = 4.0
jitter_noise = 0.1
window_size = 10.0

[model.patch_embedder]
input_channels = 3
fourier_dim = 16
context_size = 6
stride = 4
mlp_depth = 2

[model.gqa]
enabled = true
n_kv_heads = 2

[training]
ae_steps = 500
steps = 1000
lambda_coeff = 0.2
mode = "naive"
batch_size = 16
compile = true
compile_dynamic = true
schedule_bounds = [5.0, -4.0]
precision = "bf16"

# Sparse AE for compression
[training.sparse_ae]
enabled = true
n_levels = 6
patch_size = 16
hidden_dim = 256
code_dim = 128
k_per_patch = 4
residual_scale = 2.0
fourier_dim = 16
ae_loss_weight = 0.1
logsnr_loss_weight = 0.1
n_layers = 4

[training.sparse_ae.attention]
mode = "gemma_bigbird"
window_size = 4
global_layer_interval = 4
n_global_tokens = 4
bigbird_layout = [2, 2]
random_min_k = 3
random_min_p = 0.02
n_query_heads = 8
n_kv_heads = 2

[training.online_variance_correction]
enabled = true
num_buckets = 20
snr_min = -5.0
snr_max = 5.0
ema_decay = 0.99
warmup_steps = 100

[training.bucketing]
enabled = true
base_resolution = 96
base_batch_size = 16
caching_resolution = 96

[[training.bucketing.image_buckets]]
resolution = 96
weight = 1.0

[[training.bucketing.image_buckets]]
resolution = 64
weight = 0.5

# Heterogeneous optimizer: Muon for transformer, AdamW for embeddings/norms
[training.optimizer]
type = "heterogeneous"

[training.optimizer.muon]
lr = 0.02
momentum = 0.95
nesterov = true
ns_steps = 5

[training.optimizer.adamw]
lr = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]

[training.optimizer.scheduler]
type = "onecycle"
pct_start = 0.1
div_factor = 10.0
final_div_factor = 25.0

[training.ae_optimizer]
lr = 3e-4
weight_decay = 0.1
max_lr = 3e-4
pct_start = 0.1

[sampling]
num_samples = 8
steps = 25
target_logsnr = 10.0
resolutions = [96, 64]
enable_sweep = false

# Page table sized for actual workload:
# base_cost = (96/4)² × 16 = 9216 tokens/batch
# blocks_needed = 9216/128 = 72, use 128 with headroom
[page_table]
num_blocks = 128
block_size = 128
max_batch_size = 16
max_logical_blocks = 128

[logging]
output_dir = "./experiments_sprite_atlas"
log_interval = 50
sample_after_training = true

# Dataset: Sprite atlas
# 120k+ fusions, each 96x96 with artist credits and text entries
[dataset_mix.sprite_main]
type = "sprite_atlas"
ratio = 0.8
noise_mode = "uniform"
[dataset_mix.sprite_main.params]
seed = 42
data_dir = "data/infinite_fusion"
resolution = 96
text_position = "none"
[dataset_mix.sprite_main.noise_params]
min_snr = -4.0
max_snr = 5.0

# Keep some procedural data for diversity
[dataset_mix.fractal_aux]
type = "fractal"
ratio = 0.2
noise_mode = "uniform"
[dataset_mix.fractal_aux.params]
seed = 123
fractal_types = ["mandelbrot", "julia"]
color_palette = "random"
text_position = "none"
resolution = 96
max_iterations = 256
[dataset_mix.fractal_aux.noise_params]
min_snr = -4.0
max_snr = 5.0

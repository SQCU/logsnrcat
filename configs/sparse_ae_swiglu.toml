# SwiGLU FSQ Autoencoder with Fractal Data
# Same as sparse_ae_fractal.toml but using swiglu AE variant
# Changes: ae_type, attention mode (local/3x3), output_dir

[model]
dim = 512
depth = 8
num_heads = 8
topo_dim = 3
mlp_depth = 1
vocab_size = 151936
global_layer_interval = 4
num_experts = 8
num_active = 3
rope_base = 500
mlp_ratio = 4.0
jitter_noise = 0.1
window_size = 10.0

[model.patch_embedder]
input_channels = 3
fourier_dim = 16
context_size = 6
stride = 4
mlp_depth = 2

# GQA configuration for main transformer
[model.gqa]
enabled = true
n_kv_heads = 2         # 8 query heads / 2 kv heads = 4x sharing

[training]
ae_steps = 2000
steps = 0
lambda_coeff = 0.2
mode = "naive"
batch_size = 8
compile = true
compile_dynamic = true
schedule_bounds = [5.0, -4.0]
precision = "bf16"

[training.graph_capture]
enabled = true
warmup_steps = 20
capture_after_warmup = true
use_dedicated_stream = true

# Sparse AE Configuration - SWIGLU VARIANT
[training.sparse_ae]
enabled = true
ae_type = "swiglu"     # <<< Changed: binary FSQ, level-global sparsity, 2D RoPE
n_levels = 6
patch_size = 16
hidden_dim = 256
code_dim = 128
k_per_patch = 4        # For swiglu: level-global active dims
residual_scale = 2.0
fourier_dim = 16
ae_loss_weight = 0.1
logsnr_loss_weight = 0.1
n_layers = 4

# Attention configuration - sliding window for 3x3 neighborhood
[training.sparse_ae.attention]
mode = "sliding"       # <<< Changed: sliding window (3x3 neighborhood)
window_size = 2        # <<< Changed: Euclidean dist² ≤ 4 covers 3x3
n_global_tokens = 0    # <<< No registers for pure sliding window
n_query_heads = 8
n_kv_heads = 2

[training.online_variance_correction]
enabled = true
num_buckets = 20
snr_min = -5.0
snr_max = 5.0
ema_decay = 0.99
warmup_steps = 100

[training.bucketing]
enabled = true
base_resolution = 64
base_batch_size = 32
caching_resolution = 128

[[training.bucketing.image_buckets]]
resolution = 64
weight = 1.0

[[training.bucketing.image_buckets]]
resolution = 128
weight = 1.0

[[training.bucketing.image_buckets]]
resolution = 256
weight = 0.5

[training.optimizer]
lr = 5e-4
weight_decay = 0.1
max_lr = 5e-4
pct_start = 0.1
div_factor = 10.0
final_div_factor = 25.0

[training.ae_optimizer]
lr = 3e-4
weight_decay = 0.1
max_lr = 3e-4
pct_start = 0.1

[sampling]
num_samples = 8
steps = 25
target_logsnr = 10.0
resolutions = [64, 128, 256]
enable_sweep = false
sweep_count = 4
sweep_length = 4
sweep_range = [5.0, 1.0]

[page_table]
num_blocks = 1024
block_size = 128
max_batch_size = 128
max_logical_blocks = 1024

[logging]
output_dir = "./experiments_swiglu_ae"  # <<< Changed
log_interval = 50
sample_after_training = true

# Dataset mix - Fractal-heavy for AE warmup (same as sparse_ae_fractal)
[dataset_mix.fractal_main]
type = "fractal"
ratio = 0.5
noise_mode = "uniform"
[dataset_mix.fractal_main.params]
seed = 42
fractal_types = ["mandelbrot", "julia", "burning_ship"]
color_palette = "random"
text_position = "none"
resolution = 256
[dataset_mix.fractal_main.noise_params]
min_snr = -4.0
max_snr = 5.0

[dataset_mix.fractal_split]
type = "fractal"
ratio = 0.5
noise_mode = "split"
[dataset_mix.fractal_split.params]
seed = 123
fractal_types = ["julia", "tricorn"]
color_palette = "fire"
text_position = "none"
resolution = 256
[dataset_mix.fractal_split.noise_params]
min_snr = -5.0
max_snr = 5.0
angle_range_deg = 45.0

[dataset_mix.checker_baseline]
type = "checkerboard"
ratio = 0.3
noise_mode = "split"
[dataset_mix.checker_baseline.params]
seed = 456
resolution = 64
text_position = "none"
[dataset_mix.checker_baseline.noise_params]
min_snr = -4.0
max_snr = 5.0
angle_range_deg = 30.0

[dataset_mix.torus_baseline]
type = "torus"
ratio = 0.3
noise_mode = "split"
[dataset_mix.torus_baseline.params]
seed = 789
resolution = 64
text_position = "none"
[dataset_mix.torus_baseline.noise_params]
min_snr = -4.0
max_snr = 5.0
angle_range_deg = 45.0

# Sparse sprite atlas - pixel art with logit-biased sampling
[dataset_mix.sprite_atlas]
type = "sprite_atlas"
ratio = 0.4
noise_mode = "uniform"
[dataset_mix.sprite_atlas.params]
data_dir = "data/infinite_fusion"
[dataset_mix.sprite_atlas.params.sampling_config]
split = "all"
mode = "uniform_sprites"
adjustment_mode = "additive"
temperature = 1.0
seed = 42
[dataset_mix.sprite_atlas.params.sampling_config.adjustments]
"134" = 0.1              # Head ID 134 +0.1
"*.134" = 0.1            # Body ID 134 +0.1
"procedural:*" = -0.1    # Procedural sprites -0.1 (prefer custom/base)
[dataset_mix.sprite_atlas.params.render_config]
res_scaling = "do_not"
background_mode = "solid_random"  # Uniform color per sample (not noise)
jitter = true
[dataset_mix.sprite_atlas.noise_params]
min_snr = -4.0
max_snr = 5.0
